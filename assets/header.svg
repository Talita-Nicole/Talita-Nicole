<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1929" />
      <stop offset="100%" stop-color="#123A6B" />
    </linearGradient>
    <radialGradient id="glowSpot" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGradient)" />
  <rect width="1200" height="300" fill="url(#glowSpot)" />

  <g fill="#FFFFFF">
    <circle cx="60" cy="40" r="1.4" opacity="0.25" />
    <circle cx="140" cy="90" r="1" opacity="0.3" />
    <circle cx="220" cy="30" r="1.5" opacity="0.2" />
    <circle cx="310" cy="120" r="1.1" opacity="0.28" />
    <circle cx="90" cy="180" r="1.3" opacity="0.22" />
    <circle cx="180" cy="230" r="0.9" opacity="0.3" />
    <circle cx="40" cy="260" r="1.4" opacity="0.18" />
    <circle cx="380" cy="60" r="1" opacity="0.25" />
    <circle cx="150" cy="40" r="0.8" opacity="0.35" />
    <circle cx="60" cy="130" r="1.2" opacity="0.2" />
    <circle cx="820" cy="220" r="1.4" opacity="0.2" />
    <circle cx="880" cy="55" r="1.1" opacity="0.28" />
    <circle cx="940" cy="170" r="1.3" opacity="0.22" />
    <circle cx="1000" cy="90" r="1" opacity="0.3" />
    <circle cx="1050" cy="240" r="1.4" opacity="0.18" />
    <circle cx="1100" cy="50" r="1.1" opacity="0.25" />
    <circle cx="1140" cy="150" r="1.5" opacity="0.2" />
    <circle cx="1160" cy="260" r="1" opacity="0.3" />
    <circle cx="1000" cy="30" r="0.9" opacity="0.28" />
    <circle cx="850" cy="150" r="1.2" opacity="0.22" />
    <circle cx="960" cy="250" r="1.1" opacity="0.25" />
    <circle cx="1120" cy="100" r="1" opacity="0.3" />
  </g>

  <text x="600" y="138" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1" fill="#FFFFFF" filter="url(#softGlow)">
    Talita Nicole
  </text>

  <text x="600" y="180" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" letter-spacing="0.5" fill="#4FC3F7">
    Full Stack Developer • .NET &amp; AI Enthusiast
  </text>

  <line x1="450" y1="206" x2="750" y2="206" stroke="#4FC3F7" stroke-width="1" opacity="0.6" />
</svg>
